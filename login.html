<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NMLAlert System - Login</title>
  
  <!-- Premium Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="theme-space login-body">
  
  <!-- AMBIENT FLOATING GLOW BLOBS -->
  <div class="ambient-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>
 
  <div class="login-shell">
    <div class="login-card">
      
      <!-- HEADER WITH LOGO -->
      <div class="login-header">
        <div class="brand-mark login-brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h2>NMLAlert System</h2>
        <p>Network Monitoring & LINE Alert Center</p>
      </div>

      <!-- ERROR/SUCCESS MESSAGE CONTAINER -->
      <div id="loginAlert" class="login-alert hidden"></div>

      <!-- LOGIN FORM -->
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Operator Username</label>
          <div class="input-icon-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" />
              </svg>
            </span>
            <input type="text" id="username" placeholder="Enter operator ID (e.g. admin)" required autocomplete="username" />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Security Password</label>
          <div class="input-icon-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
            </span>
            <input type="password" id="password" placeholder="Enter password (e.g. admin)" required autocomplete="current-password" />
            <button type="button" class="password-toggle-btn" id="passwordToggleBtn" aria-label="Toggle password visibility">
              <svg id="eyeOpenIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" /><circle cx="12" cy="12" r="3" />
              </svg>
              <svg id="eyeClosedIcon" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" /><line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            </button>
          </div>
        </div>

        <div class="form-row-utility">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe" />
            <span>Remember session</span>
          </label>
          <a href="#" class="forgot-link">Reset Credentials</a>
        </div>

        <button type="submit" class="form-btn primary login-submit-btn" id="submitBtn">
          <span>Authorize Access</span>
          <svg class="icon-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12" /><polyline points="12 5 19 12 12 19" />
          </svg>
          <div class="btn-spinner hidden" id="btnSpinner"></div>
        </button>
      </form>

      <!-- SYSTEM FOOTER -->
      <div class="login-footer">
        <span>SLA Encrypted Tunnel Connection</span>
        <span class="pulse-dot"></span>
      </div>
    </div>
  </div>

  <!-- THEME AUTO-SYNC -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Sync theme with localStorage
      const savedTheme = localStorage.getItem("noc-theme") || "space";
      document.body.className = "theme-space login-body"; // reset
      document.body.classList.remove("theme-space");
      document.body.classList.add(`theme-${savedTheme}`);

      const loginForm = document.getElementById("loginForm");
      const loginAlert = document.getElementById("loginAlert");
      const passwordInput = document.getElementById("password");
      const passwordToggleBtn = document.getElementById("passwordToggleBtn");
      const eyeOpenIcon = document.getElementById("eyeOpenIcon");
      const eyeClosedIcon = document.getElementById("eyeClosedIcon");
      const submitBtn = document.getElementById("submitBtn");
      const btnSpinner = document.getElementById("btnSpinner");

      // Password visibility toggle
      passwordToggleBtn.addEventListener("click", () => {
        const isPassword = passwordInput.getAttribute("type") === "password";
        passwordInput.setAttribute("type", isPassword ? "text" : "password");
        eyeOpenIcon.classList.toggle("hidden", !isPassword);
        eyeClosedIcon.classList.toggle("hidden", isPassword);
      });

      // Submit Form with database authentication API
      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const username = document.getElementById("username").value.trim();
        const password = passwordInput.value;

        // Show spinner state
        submitBtn.classList.add("loading");
        btnSpinner.classList.remove("hidden");
        loginAlert.className = "login-alert hidden";

        try {
          const res = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
          });
          const data = await res.json();

          if (res.ok && data.success) {
            // Authentication Success
            loginAlert.textContent = `Access Authorized. Welcome back ${data.user.username}!`;
            loginAlert.className = "login-alert success";
            localStorage.setItem("noc-logged-in", "true");
            
            setTimeout(() => {
              window.location.href = "index.html";
            }, 1000);
          } else {
            // Authentication Failure
            loginAlert.textContent = data.message || "Invalid operator credentials!";
            loginAlert.className = "login-alert error";
            submitBtn.classList.remove("loading");
            btnSpinner.classList.add("hidden");
          }
        } catch (err) {
          loginAlert.textContent = "Unable to reach database server! Continuing with mock check...";
          loginAlert.className = "login-alert error";
          
          // Network error offline backup fallback
          if (username.toLowerCase() === "admin" && password === "admin") {
            loginAlert.textContent = "Authorized via local offline fallback config. Redirecting...";
            loginAlert.className = "login-alert success";
            localStorage.setItem("noc-logged-in", "true");
            setTimeout(() => { window.location.href = "index.html"; }, 1000);
          } else {
            submitBtn.classList.remove("loading");
            btnSpinner.classList.add("hidden");
          }
        }
      });
    });
  </script>
</body>
</html>
